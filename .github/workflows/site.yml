# Сборка и публикация сайта «ЭРА-Вольвоман» на GitHub Pages (S8).
# Контент — репозиторий era-vlvmn (05-content/cards); берётся при сборке по токену CONTENT_TOKEN (чтение).
# Запуск: push в main этого репозитория; repository_dispatch «content-updated» из era-vlvmn; вручную.
name: site
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neman-technical-solutions/era-vlvmn
          token: ${{ secrets.CONTENT_TOKEN }}
          path: content
          sparse-checkout: 05-content/cards
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CARDS_DIR: content/05-content/cards
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
